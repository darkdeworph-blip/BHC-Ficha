<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mesa — Black Hole Clube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bhc.css">
<link rel="stylesheet" href="mesa.css">
</head>
<body class="mesa-pg">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="d20" viewBox="0 0 100 100">
    <polygon points="50,3 96,27 96,73 50,97 4,73 4,27" fill="#fff"/>
    <polygon points="34,40 66,40 50,68" fill="none" stroke="#000" stroke-width="2.5"/>
    <path d="M50 3L34 40M50 3L66 40M4 27L34 40M96 27L66 40M4 73L34 40M96 73L66 40M50 97L50 68M4 73L50 68M96 73L50 68M4 27L4 73M96 27L96 73" stroke="#000" stroke-width="2.2" fill="none"/>
    <ellipse cx="50" cy="52" rx="19" ry="8" fill="none" stroke="#CC0000" stroke-width="3.5" transform="rotate(-8 50 52)"/>
  </symbol>
</svg>

<div class="mesa-app" id="app">

  <header class="mesa-top">
    <div class="mt-esq">
      <a class="bhc-quadro" href="./" aria-label="Voltar ao início">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <svg class="mt-logo" aria-hidden="true"><use href="#d20"/></svg>
      <div class="mt-titulo">
        <strong id="cenaNome">Mesa</strong>
        <span id="statusLinha"><i></i><span id="statusTxt">Conectando...</span></span>
      </div>
    </div>
    <nav class="bhc-seg mt-seg" aria-label="Alternar entre mesa e ficha">
      <a href="mesa.html" class="on" aria-current="page">Mesa</a>
      <a href="ficha.html">Ficha</a>
    </nav>
    <div class="mt-dir">
      <div class="mt-gente" id="gente" aria-label="Pessoas conectadas"></div>
      <button class="bhc-quadro" id="btnMenu" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <div class="mesa-corpo">

    <div class="mesa-ferr" role="toolbar" aria-label="Ferramentas" id="ferr">
      <button type="button" data-tool="sel" aria-label="Selecionar" title="Selecionar e mover (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 3l14 8-6 2-2 6z"/></svg><span>Mover</span></button>
      <button type="button" data-tool="mov" aria-label="Mover a tela" title="Arrastar a tela (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg><span>Tela</span></button>
      <button type="button" data-tool="tok" data-so-mestre aria-label="Boneco" title="Adicionar boneco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Boneco</span></button>
      <button type="button" data-tool="note" aria-label="Nota" title="Nota (N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 4h16v11l-5 5H4z"/><path d="M15 20v-5h5"/></svg><span>Nota</span></button>
      <button type="button" data-tool="draw" aria-label="Desenhar" title="Desenhar (D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg><span>Desenhar</span></button>
      <button type="button" data-tool="img" data-so-mestre aria-label="Imagem do mapa (só mestre)" title="Imagem do mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></svg><span>Mapa</span></button>
      <button type="button" id="btnPainel" class="so-celular" aria-label="Abrir painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Painel</span></button>
    </div>

    <div class="mesa-tela" id="tela">
      <div class="mundo" id="mundo">
        <div class="mapa-wrap" id="mapaWrap"><img id="mapaImg" alt="" draggable="false" hidden></div>
        <div class="grade" id="grade" hidden></div>
        <svg class="tracos" id="tracos" width="1" height="1" overflow="visible"></svg>
        <div class="camada" id="camada"></div>
      </div>

      <div class="aviso-topo" id="avisoTopo" hidden></div>
      <div class="aviso-centro" id="avisoCentro" hidden></div>

      <div class="chip-ferr" id="chipFerr">Ferramenta: <strong id="ferrNome">Mover</strong></div>
      <div class="opcoes-desenho" id="opcoesDesenho" hidden>
        <div class="cores" id="coresDesenho"></div>
        <label>Espessura <input type="range" id="espessura" min="2" max="14" value="4"></label>
      </div>
      <div class="zoom">
        <button type="button" id="zMenos" aria-label="Diminuir o zoom">−</button>
        <span id="zTxt">100%</span>
        <button type="button" id="zMais" aria-label="Aumentar o zoom">+</button>
        <button type="button" id="zAjustar" aria-label="Ajustar à tela" title="Ajustar à tela"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>

      <!-- cartão do boneco selecionado (celular, com o painel fechado) -->
      <div class="cartao-sel" id="cartaoSel" hidden></div>
    </div>

    <aside class="mesa-painel" id="painel" aria-label="Painel da mesa">
      <button type="button" class="fechar-painel so-celular" id="btnFecharPainel" aria-label="Fechar painel">×</button>

      <section class="pn-bloco" id="blocoVer" hidden>
        <span class="pn-rot">Ver a mesa como (só mestre)</span>
        <div class="bhc-seg pn-seg" id="segVer">
          <button type="button" data-ver="mestre" class="on">Mestre</button>
          <button type="button" data-ver="jogador">Jogadores</button>
        </div>
      </section>

      <section class="pn-bloco" id="blocoSel"></section>

      <div class="pn-abas" id="abas">
        <button type="button" data-aba="cenas" class="on">Cenas</button>
        <button type="button" data-aba="bonecos">Bonecos</button>
        <button type="button" data-aba="notas">Notas</button>
        <button type="button" data-aba="fichas" data-so-mestre hidden>Fichas</button>
      </div>
      <div class="pn-conteudo" id="conteudo"></div>
    </aside>
  </div>

  <div class="bhc-fundo-gaveta" id="gavetaFundo" hidden></div>
  <aside class="bhc-gaveta" id="gaveta" aria-label="Menu" hidden>
    <h2>Menu</h2>
    <a href="./">Início</a>
    <a href="ficha.html">Minha ficha</a>
    <button class="item" id="btnCampanha" type="button" hidden>Nome da campanha e sessão</button>
    <button class="item" id="btnAjuda" type="button">Como usar a mesa</button>
    <button class="item" id="btnLimparLocal" type="button" hidden>Apagar a mesa de teste</button>
    <p class="fim" id="gavetaFim"></p>
  </aside>

  <div class="dialogo-fundo" id="dialogoFundo" hidden>
    <div class="dialogo" role="dialog" aria-modal="true" id="dialogo"></div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script type="module" src="mesa.js"></script>
</body>
</html>
